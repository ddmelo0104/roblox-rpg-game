name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same versions as rokit.toml
  ROJO_VERSION: 7.4.4
  SELENE_VERSION: 0.27.1
  STYLUA_VERSION: 0.20.0

jobs:
  quality:
    name: Format, lint, backlog and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools (rokit.toml versions)
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -fsSL -o rojo.zip   "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          curl -fsSL -o selene.zip "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          for z in *.zip; do unzip -o -q "$z"; done
          chmod +x rojo selene stylua
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Format (StyLua)
        run: stylua --check src

      - name: Lint (Selene, Roblox std; warnings fail too)
        run: selene src

      - name: Backlog up to date
        run: python3 tools/backlog.py --check

      - name: Build the place (Rojo)
        run: rojo build default.project.json --output roblox-rpg-game.rbxl
